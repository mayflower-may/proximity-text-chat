name: Release

# Publish a GitHub release with a tag like v3.0.0; this workflow attaches module.json and module.zip.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and download URL in module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg m "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version=$v | .manifest=$m | .download=$d' module.json > module.tmp && mv module.tmp module.json

      - name: Zip the module
        run: zip -r module.zip module.json scripts/ styles/ lang/ LICENSE README.md

      - name: Attach files to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
